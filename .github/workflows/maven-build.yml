name: Spring Boot Build and Test

on:
  push:
    branches: '**' 
  pull_request:
    branches: '**'
  workflow_dispatch:  # Allow manual trigger for testing

# Grants the GITHUB_TOKEN permission to push branches and create PRs
permissions:
  contents: write
  pull-requests: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important: Fetch all history for git push to work

      # - name: Setup GitHub CLI
      #   run: |
      #     echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token  

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install google-generativeai

      - name: Stage 1 - Print starting
        run: echo "Starting..."

      - name: Stage 2 - Run Maven Clean Install
        run: mvn clean install

      - name: Stage 4 - AI Self-Healing Agent
        # ONLY runs if the previous Maven Test step fails
        if: failure()
        env:
          # This maps the secret to an environment variable in the Ubuntu runner
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TARGET_EXCEPTIONS: "java.lang.NullPointerException,java.lang.ClassCastException,java.lang.IndexOutOfBoundsException,java.lang.IllegalArgumentException"
        run: |
          echo "Tests failed. Invoking AI self-healing script..."
          pip install anthropic
          python .github/scripts/self_healer.py

      - name: Stage 5 - Print Result
        if: always()
        run: |
          echo "Done with test. Result: ${{ job.status }}"